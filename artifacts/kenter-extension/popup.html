<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenter Tech Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0d0f14;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    .header {
      background: #131720;
      border-bottom: 1px solid #1e2433;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .logo span { color: #06b6d4; }

    .status {
      padding: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0d2e1a;
      border: 1px solid #16a34a33;
      color: #4ade80;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      width: 100%;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .info {
      margin-top: 12px;
      color: #64748b;
      line-height: 1.5;
      font-size: 12px;
    }

    .divider {
      height: 1px;
      background: #1e2433;
      margin: 14px 0;
    }

    .version {
      color: #334155;
      font-size: 11px;
      text-align: center;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">KENTER<span>_TECH</span></div>
  </div>
  <div class="status">
    <div class="badge">
      <div class="dot"></div>
      Extension Active
    </div>
    <p class="info">
      When you click <strong>Access Tool</strong> on the portal, cookies are automatically
      injected and the tool opens instantly.
    </p>
    <div class="divider"></div>
    <div class="version" id="version"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
