openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kenter Tech Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: tools
    description: Digital tools
  - name: admin
    description: Admin operations
  - name: subscriptions
    description: Subscription management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ─────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── Tools ────────────────────────────────────────────────────────────────
  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all tools
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      operationId: createTool
      tags: [tools]
      summary: Create a new tool (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /tools/{id}:
    get:
      operationId: getTool
      tags: [tools]
      summary: Get a tool by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateTool
      tags: [tools]
      summary: Update a tool (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpdate"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTool
      tags: [tools]
      summary: Delete a tool (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── Subscriptions ────────────────────────────────────────────────────────
  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get the current user's subscription
      responses:
        "200":
          description: Subscription (null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  # ─── Admin ────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithSubscription"

  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update a user's role or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get dashboard statistics (admin)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/subscriptions:
    get:
      operationId: adminListSubscriptions
      tags: [admin]
      summary: List all subscriptions (admin only)
      responses:
        "200":
          description: All subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionWithUser"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ─── Auth schemas ────────────────────────────────────────────────────────
    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ─── User schemas ────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, subscriptionStatus, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, subscriber]
        subscriptionStatus:
          type: string
          enum: [active, inactive, trial, expired]
        createdAt:
          type: string
          format: date-time

    UserWithSubscription:
      type: object
      required: [id, name, email, role, subscriptionStatus, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, subscriber]
        subscriptionStatus:
          type: string
          enum: [active, inactive, trial, expired]
        createdAt:
          type: string
          format: date-time
        subscription:
          $ref: "#/components/schemas/Subscription"

    UserAdminUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, subscriber]
        subscriptionStatus:
          type: string
          enum: [active, inactive, trial, expired]

    # ─── Tool schemas ────────────────────────────────────────────────────────
    Tool:
      type: object
      required: [id, name, description, status, category, redirectUrl, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, coming_soon]
        category:
          type: string
        redirectUrl:
          type: string
        iconUrl:
          type: ["string", "null"]
        credentials:
          type: ["string", "null"]
          description: "Login credentials, cookies, API keys, or any access details subscribers need to use this tool"
        createdAt:
          type: string
          format: date-time

    ToolInput:
      type: object
      required: [name, description, status, category, redirectUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, coming_soon]
        category:
          type: string
        redirectUrl:
          type: string
        iconUrl:
          type: string
        credentials:
          type: string
          description: "Login credentials, cookies, API keys, or any access details subscribers need to use this tool"

    ToolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, coming_soon]
        category:
          type: string
        redirectUrl:
          type: string
        iconUrl:
          type: string
        credentials:
          type: string
          description: "Login credentials, cookies, API keys, or any access details subscribers need to use this tool"

    # ─── Subscription schemas ─────────────────────────────────────────────────
    Subscription:
      type: object
      required: [id, userId, status, planType, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        status:
          type: string
          enum: [active, inactive, trial, expired]
        planType:
          type: string
          enum: [monthly, annual, lifetime]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    SubscriptionWithUser:
      type: object
      required: [id, userId, status, planType, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        status:
          type: string
          enum: [active, inactive, trial, expired]
        planType:
          type: string
          enum: [monthly, annual, lifetime]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    SubscriptionInput:
      type: object
      required: [planType]
      properties:
        planType:
          type: string
          enum: [monthly, annual, lifetime]

    SubscriptionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, trial, expired]
        planType:
          type: string
          enum: [monthly, annual, lifetime]
        expiresAt:
          type: ["string", "null"]
          format: date-time

    # ─── Dashboard Stats ───────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalUsers, totalTools, activeSubscriptions, toolsByCategory, subscriptionsByPlan, recentUsers]
      properties:
        totalUsers:
          type: number
        totalTools:
          type: number
        activeSubscriptions:
          type: number
        toolsByCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: number
        subscriptionsByPlan:
          type: array
          items:
            type: object
            required: [planType, count]
            properties:
              planType:
                type: string
              count:
                type: number
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"
